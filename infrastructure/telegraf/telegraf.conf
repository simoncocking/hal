# Telegraf configuration for off-grid power system
# Subscribes to MQTT topics and writes to InfluxDB

[global_tags]
  site = "tallarook"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  flush_jitter = "0s"

# ============================================================
# Output: InfluxDB v2
# ============================================================
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$INFLUX_TOKEN"
  organization = "hal"
  bucket = "power"

# ============================================================
# Input: Power system data from Hal RS485 tap
# ============================================================
[[inputs.mqtt_consumer]]
  name_override = "sunny_island"
  servers = ["tcp://${MQTT_BROKER}:1883"]
  topics = [
    "power/battery/charge",
    "power/battery/fan",
    "power/flow/power",
    "power/flow/status",
    "power/load",
    "power/genset/output",
    "power/genset/engaged",
    "power/genset/request",
    "power/time",
  ]
  data_format = "value"
  data_type = "string"

  # Parse the topic to create meaningful tag and field names
  # Topic structure: power/<category>/<metric>
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "power/+/+"
    tags = "power/category/metric"
    # Drop the "power" prefix tag
    [inputs.mqtt_consumer.topic_parsing.types]

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "power/+"
    tags = "power/metric"

# ============================================================
# Input: Solar PV data from SBFspot
# ============================================================
[[inputs.mqtt_consumer]]
  name_override = "sunny_boy"
  servers = ["tcp://${MQTT_BROKER}:1883"]
  topics = [
    "power/pv/#",
  ]
  data_format = "value"
  data_type = "string"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "power/pv/+"
    tags = "power/pv/metric"

# ============================================================
# Input: Solar hot water system from ESP32
# ============================================================
[[inputs.mqtt_consumer]]
  name_override = "solar_hot_water"
  servers = ["tcp://${MQTT_BROKER}:1883"]
  topics = [
    "shw/manifold",
    "shw/tank_upper",
    "shw/tank_lower",
  ]
  data_format = "value"
  data_type = "float"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "shw/+"
    tags = "shw/sensor"

# ============================================================
# Input: Tasmota device power states
# ============================================================
[[inputs.mqtt_consumer]]
  name_override = "tasmota"
  servers = ["tcp://${MQTT_BROKER}:1883"]
  topics = [
    "stat/+/POWER",
    "stat/+/POWER1",
    "stat/+/POWER2",
  ]
  data_format = "value"
  data_type = "string"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "stat/+/+"
    tags = "stat/device/relay"

# ============================================================
# Input: Tank levels (if available)
# ============================================================
[[inputs.mqtt_consumer]]
  name_override = "tanks"
  servers = ["tcp://${MQTT_BROKER}:1883"]
  topics = [
    "tank/#",
  ]
  data_format = "value"
  data_type = "string"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "tank/+/+"
    tags = "tank/name/metric"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "tank/+"
    tags = "tank/metric"
