# Telegraf configuration for off-grid power system
# Subscribes to MQTT topics and writes to InfluxDB

[global_tags]
  site = "tallarook"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  flush_jitter = "0s"

# ============================================================
# Output: InfluxDB v2
# ============================================================
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$INFLUX_TOKEN"
  organization = "hal"
  bucket = "power"

# ============================================================
# Input: Sunny Island full channel data from yasdi2mqtt
# ============================================================
# yasdi2mqtt publishes JSON to solar/sunny_island/<serial_number>
# with payload: {"timestamp":..., "sn":..., "values":{"Pac":..., ...}}
# This captures ALL spot channels exposed by the SI via YASDI.
# DISABLED: Enable once yasdi2mqtt is producing data (requires SI-COMSMA module)
# [[inputs.mqtt_consumer]]
#   name_override = "sunny_island"
#   servers = ["tcp://${MQTT_BROKER}:1883"]
#   topics = [
#     "solar/sunny_island/#",
#   ]
#   data_format = "json_v2"
#   [[inputs.mqtt_consumer.topic_parsing]]
#     topic = "solar/sunny_island/+"
#     tags = "solar/sunny_island/serial_number"
#   [inputs.mqtt_consumer.json_v2]
#     [[inputs.mqtt_consumer.json_v2.object]]
#       path = "values"
#     [[inputs.mqtt_consumer.json_v2.tag]]
#       path = "sn"

# ============================================================
# Input: Power system data from Hal RS485 tap (transitional)
# ============================================================
# This section can be removed once yasdi2mqtt is confirmed working
# and providing all the same data points.
# Numeric SI metrics
[[inputs.mqtt_consumer]]
  name_override = "sunny_island"
  servers = ["tcp://${MQTT_BROKER}:1883"]
  topics = [
    "power/battery/charge",
    "power/flow/power",
    "power/load",
    "power/genset/output",
    "power/grid/volts",
    "power/grid/frequency",
  ]
  data_format = "value"
  data_type = "float"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "power/+/+"
    tags = "_/_/metric"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "power/+"
    tags = "_/metric"

# String SI metrics (status, booleans, timestamps)
[[inputs.mqtt_consumer]]
  name_override = "sunny_island_status"
  servers = ["tcp://${MQTT_BROKER}:1883"]
  topics = [
    "power/battery/fan",
    "power/flow/status",
    "power/genset/engaged",
    "power/genset/request",
    "power/time",
  ]
  data_format = "value"
  data_type = "string"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "power/+/+"
    tags = "_/_/metric"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "power/+"
    tags = "_/metric"

# ============================================================
# Input: Solar PV data from SBFspot
# ============================================================
[[inputs.mqtt_consumer]]
  name_override = "sunny_boy"
  servers = ["tcp://${MQTT_BROKER}:1883"]
  topics = [
    "power/pv/#",
  ]
  data_format = "value"
  data_type = "string"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "power/pv/+"
    tags = "power/pv/metric"

# ============================================================
# Input: Solar hot water system from ESP32
# ============================================================
[[inputs.mqtt_consumer]]
  name_override = "solar_hot_water"
  servers = ["tcp://${MQTT_BROKER}:1883"]
  topics = [
    "shw/manifold",
    "shw/tank_upper",
    "shw/tank_lower",
  ]
  data_format = "value"
  data_type = "float"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "shw/+"
    tags = "shw/sensor"

# ============================================================
# Input: Tasmota device power states
# ============================================================
[[inputs.mqtt_consumer]]
  name_override = "tasmota"
  servers = ["tcp://${MQTT_BROKER}:1883"]
  topics = [
    "stat/+/POWER",
    "stat/+/POWER1",
    "stat/+/POWER2",
  ]
  data_format = "value"
  data_type = "string"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "stat/+/+"
    tags = "stat/device/relay"

# ============================================================
# Input: Tank levels (if available)
# ============================================================
[[inputs.mqtt_consumer]]
  name_override = "tanks"
  servers = ["tcp://${MQTT_BROKER}:1883"]
  topics = [
    "tank/#",
  ]
  data_format = "value"
  data_type = "string"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "tank/+/+"
    tags = "tank/name/metric"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "tank/+"
    tags = "tank/metric"
