# Home Assistant configuration for off-grid power system
# Location: Tallarook, Victoria, Australia

homeassistant:
  name: Hal
  latitude: -37.171914
  longitude: 145.135366
  elevation: 400
  unit_system: metric
  time_zone: Australia/Melbourne
  currency: AUD

# Enable the default set of integrations
default_config:

# MQTT broker running on Pi 1
# NOTE: Broker connection (host/port) is configured in the HA UI:
#   Settings -> Devices & Services -> MQTT -> Configure
#   Set broker to 10.0.0.3, port 1883
mqtt:
  sensor:
    # ==========================================================
    # Sunny Island sensors from Elixir RS485 tap
    # ==========================================================
    - name: "Battery SOC"
      state_topic: "power/battery/charge"
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement
      unique_id: hal_battery_soc

    - name: "Charge/Discharge Power"
      state_topic: "power/flow/power"
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement
      unique_id: hal_flow_power

    - name: "Flow Status"
      state_topic: "power/flow/status"
      unique_id: hal_flow_status

    - name: "House Load"
      state_topic: "power/load"
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement
      unique_id: hal_house_load

    - name: "Generator Output"
      state_topic: "power/genset/output"
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement
      unique_id: hal_genset_output

    - name: "Sunny Island Time"
      state_topic: "power/time"
      unique_id: hal_si_time

    - name: "Grid Voltage"
      state_topic: "power/grid/volts"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      unique_id: hal_grid_volts

    - name: "Grid Frequency"
      state_topic: "power/grid/frequency"
      unit_of_measurement: "Hz"
      device_class: frequency
      state_class: measurement
      unique_id: hal_grid_frequency

    # --- Solar PV sensors (from SBFspot via MQTT) ---
    - name: "PV AC Power"
      state_topic: "power/pv/ac_watts"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      unique_id: hal_pv_ac_watts

    - name: "PV AC Current"
      state_topic: "power/pv/ac_amps"
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
      unique_id: hal_pv_ac_amps

    - name: "PV Energy Today"
      state_topic: "power/pv/kwh_today"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      unique_id: hal_pv_kwh_today

    - name: "PV Energy Total"
      state_topic: "power/pv/kwh_total"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      unique_id: hal_pv_kwh_total

    - name: "PV Inverter Temperature"
      state_topic: "power/pv/temperature"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      unique_id: hal_pv_temperature

    - name: "PV String 1 Voltage"
      state_topic: "power/pv/string_1/dc_volts"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      unique_id: hal_pv_string1_volts

    - name: "PV String 2 Voltage"
      state_topic: "power/pv/string_2/dc_volts"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      unique_id: hal_pv_string2_volts

    - name: "PV String 1 Current"
      state_topic: "power/pv/string_1/dc_amps"
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
      unique_id: hal_pv_string1_amps

    - name: "PV String 2 Current"
      state_topic: "power/pv/string_2/dc_amps"
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
      unique_id: hal_pv_string2_amps

    - name: "PV String 1 Power"
      state_topic: "power/pv/string_1/dc_watts"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      unique_id: hal_pv_string1_watts

    - name: "PV String 2 Power"
      state_topic: "power/pv/string_2/dc_watts"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      unique_id: hal_pv_string2_watts

    - name: "PV Inverter Status"
      state_topic: "power/pv/status"
      unique_id: hal_pv_status

    - name: "PV Grid Relay"
      state_topic: "power/pv/relay"
      unique_id: hal_pv_relay

    # --- Solar hot water sensors (from ESP32) ---
    - name: "SHW Manifold Temperature"
      state_topic: "shw/manifold"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      unique_id: hal_shw_manifold

    - name: "SHW Tank Upper Temperature"
      state_topic: "shw/tank_upper"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      unique_id: hal_shw_tank_upper

    - name: "SHW Tank Lower Temperature"
      state_topic: "shw/tank_lower"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      unique_id: hal_shw_tank_lower

  # --- Binary sensors ---
  binary_sensor:
    - name: "Generator Engaged"
      state_topic: "power/genset/engaged"
      payload_on: "true"
      payload_off: "false"
      device_class: running
      unique_id: hal_genset_engaged

    - name: "Generator Requested"
      state_topic: "power/genset/request"
      payload_on: "true"
      payload_off: "false"
      unique_id: hal_genset_request

    - name: "Battery Fan"
      state_topic: "power/battery/fan"
      payload_on: "true"
      payload_off: "false"
      device_class: running
      unique_id: hal_battery_fan

# Split battery power into separate charge/discharge sensors
# Elixir app: positive = charge, negative = discharge
# Each sensor clamps to zero when the flow is in the other direction
template:
  - sensor:
      - name: "Battery Charge Power"
        state: "{{ [(states('sensor.charge_discharge_power') | float(0)) * -1, 0] | max }}"
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        unique_id: hal_battery_charge_power

      - name: "Battery Discharge Power"
        state: "{{ [states('sensor.charge_discharge_power') | float(0), 0] | max }}"
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        unique_id: hal_battery_discharge_power

      - name: "True House Load"
        state: >-
          {% set pv_state = states('sensor.solar_pv_power') %}
          {% set load = states('sensor.house_load') | float(0) %}
          {% if pv_state in ['unavailable', 'unknown'] %}
            {{ load }}
          {% else %}
            {{ (pv_state | float(0) / 1000) + load }}
          {% endif %}
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        unique_id: hal_true_house_load

# Synthesised energy sensors from power measurements
# Uses Riemann sum integration (trapezoidal) to convert kW → kWh
# Also includes rolling averages for SHW pump control (matches NodeRED smoothing)
sensor:
  # Rolling averages for SHW pump control
  # Manifold: 60s window (~12 samples at 5s interval)
  # Tank upper: 5 minute window (~60 samples at 5s interval)
  - platform: statistics
    name: "SHW Manifold Average"
    entity_id: sensor.shw_manifold_temperature
    state_characteristic: mean
    max_age:
      seconds: 60
    unique_id: hal_shw_manifold_avg

  - platform: statistics
    name: "SHW Tank Upper Average"
    entity_id: sensor.shw_tank_upper_temperature
    state_characteristic: mean
    max_age:
      minutes: 5
    unique_id: hal_shw_tank_upper_avg

  - platform: statistics
    name: "SHW Tank Lower Average"
    entity_id: sensor.shw_tank_lower_temperature
    state_characteristic: mean
    max_age:
      minutes: 5
    unique_id: hal_shw_tank_lower_avg

  - platform: integration
    source: sensor.battery_charge_power
    name: "Battery Energy In"
    unit_prefix: ~
    method: trapezoidal
    unique_id: hal_battery_energy_in

  - platform: integration
    source: sensor.battery_discharge_power
    name: "Battery Energy Out"
    unit_prefix: ~
    method: trapezoidal
    unique_id: hal_battery_energy_out

  - platform: integration
    source: sensor.true_house_load
    name: "House Energy"
    unit_prefix: ~
    method: trapezoidal
    unique_id: hal_house_energy

  - platform: integration
    source: sensor.generator_output
    name: "Generator Energy"
    unit_prefix: ~
    method: trapezoidal
    unique_id: hal_generator_energy

# Input numbers for SHW pump control algorithm tuning
input_number:
  shw_start_ratio:
    name: SHW Pump Start Ratio
    min: 1.1
    max: 1.5
    step: 0.05
    initial: 1.30
    mode: box

  shw_stop_ratio:
    name: SHW Pump Stop Ratio
    min: 1.0
    max: 1.4
    step: 0.05
    initial: 1.25
    mode: box

  shw_max_manifold:
    name: SHW Max Manifold Temperature
    min: 60
    max: 95
    step: 1
    initial: 80
    unit_of_measurement: "°C"
    mode: box

# Automations are in automations.yaml
automation: !include automations.yaml
