# ============================================================
# Solar Hot Water Pump Control
# ============================================================
# Replicates the NodeRED SHW pump logic:
# - Start pump when manifold >= min(tank_upper * start_ratio, max_manifold)
# - Stop pump when manifold <= tank_upper * stop_ratio
# The pump is tasmota_418815 relay 1 (Solar pump).

- id: shw_pump_start
  alias: "SHW: Start circulation pump"
  description: "Start solar hot water pump when manifold is hot enough relative to tank"
  trigger:
    - platform: state
      entity_id: sensor.shw_manifold_temperature
  condition:
    - condition: template
      value_template: >-
        {% set manifold = states('sensor.shw_manifold_temperature') | float(0) %}
        {% set tank_upper = states('sensor.shw_tank_upper_temperature') | float(0) %}
        {% set start_ratio = states('input_number.shw_start_ratio') | float(1.30) %}
        {% set max_temp = states('input_number.shw_max_manifold') | float(80) %}
        {% set threshold = [tank_upper * start_ratio, max_temp] | min %}
        {{ manifold >= threshold and manifold > 0 and tank_upper > 0 }}
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.tasmota_418815_1

- id: shw_pump_stop
  alias: "SHW: Stop circulation pump"
  description: "Stop solar hot water pump when manifold cools below threshold"
  trigger:
    - platform: state
      entity_id: sensor.shw_manifold_temperature
  condition:
    - condition: template
      value_template: >-
        {% set manifold = states('sensor.shw_manifold_temperature') | float(0) %}
        {% set tank_upper = states('sensor.shw_tank_upper_temperature') | float(0) %}
        {% set stop_ratio = states('input_number.shw_stop_ratio') | float(1.25) %}
        {{ manifold <= tank_upper * stop_ratio and tank_upper > 0 }}
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.tasmota_418815_1

# ============================================================
# Water Transfer Pump Auto-Off (30 minute safety timer)
# ============================================================
# When the water transfer pump (tasmota_418815 relay 2) turns on,
# automatically turn it off after 30 minutes.

- id: xfer_pump_auto_off
  alias: "Water: Transfer pump auto-off after 30 minutes"
  description: "Safety timer to prevent transfer pump running indefinitely"
  trigger:
    - platform: state
      entity_id: switch.tasmota_418815_2
      to: "on"
      for:
        minutes: 30
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.tasmota_418815_2

# ============================================================
# Solar-Aware Schedulers
# ============================================================

# Beer chiller: on when sun elevation > 10°, daily 15:00-22:00
- id: beer_chiller_on
  alias: "Schedule: Beer chiller on (solar)"
  trigger:
    - platform: numeric_state
      entity_id: sun.sun
      attribute: elevation
      above: 10
  condition:
    - condition: time
      after: "15:00:00"
      before: "22:00:00"
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.tasmota_cb1e76

- id: beer_chiller_off
  alias: "Schedule: Beer chiller off"
  trigger:
    - platform: time
      at: "22:00:00"
    - platform: numeric_state
      entity_id: sun.sun
      attribute: elevation
      below: 10
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.tasmota_cb1e76

# Desk light: on at dusk (sun elevation < 8°), off at 23:00
- id: desk_light_on
  alias: "Schedule: Desk light on at dusk"
  trigger:
    - platform: numeric_state
      entity_id: sun.sun
      attribute: elevation
      below: 8
  condition:
    - condition: time
      after: "16:00:00"
      before: "23:00:00"
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.tasmota_f9ecee

- id: desk_light_off
  alias: "Schedule: Desk light off"
  trigger:
    - platform: time
      at: "23:00:00"
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.tasmota_f9ecee

# Stair lights: on at dusk (sun elevation < 8°), off at 23:00
- id: stair_lights_on
  alias: "Schedule: Stair lights on at dusk"
  trigger:
    - platform: numeric_state
      entity_id: sun.sun
      attribute: elevation
      below: 8
  condition:
    - condition: time
      after: "16:00:00"
      before: "23:00:00"
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.tasmota_e8d958_2

- id: stair_lights_off
  alias: "Schedule: Stair lights off"
  trigger:
    - platform: time
      at: "23:00:00"
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.tasmota_e8d958_2

# ============================================================
# 433MHz Bedroom Button (via NinjaCape)
# ============================================================
# The bedroom button sends code "011111010101010100110000" via
# ninjaCape/input/11. Toggle the bedroom light (tasmota_FAB09F).

- id: bedroom_button_toggle
  alias: "Button: Bedroom light toggle (433MHz)"
  trigger:
    - platform: mqtt
      topic: "ninjaCape/input/11"
      payload: "011111010101010100110000"
  action:
    - service: switch.toggle
      target:
        entity_id: switch.tasmota_fab09f

# ============================================================
# Tasmota Switch Masquerade
# ============================================================
# The downstairs stair light physical switch (tasmota_E8DA6E power1)
# controls the upstairs stair light relay (tasmota_E8D958 power2).

- id: stair_light_masquerade
  alias: "Masquerade: Downstairs switch → Stair lights"
  trigger:
    - platform: mqtt
      topic: "stat/tasmota_E8DA6E/POWER1"
  action:
    - service: mqtt.publish
      data:
        topic: "cmnd/tasmota_E8D958/power2"
        payload: "{{ trigger.payload }}"
