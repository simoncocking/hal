- id: shw_pump_control
  alias: 'SHW: Circulation pump control'
  description: Evaluate pump state on each manifold temperature update. Start when
    manifold >= min(tank_upper * start_ratio, max_manifold) and pump is off. Stop
    when manifold <= tank_upper * stop_ratio and pump is on. Between thresholds (deadband),
    do nothing — pump stays in its current state.
  mode: single
  trigger:
  - platform: state
    entity_id: sensor.shw_manifold_average
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: switch.tasmota_4
        state: 'off'
      - condition: template
        value_template: '{% set manifold = states(''sensor.shw_manifold_average'')
          | float(0) %} {% set tank_upper = states(''sensor.shw_tank_upper_average'')
          | float(0) %} {% set start_ratio = states(''input_number.shw_start_ratio'')
          | float(1.30) %} {% set max_temp = states(''input_number.shw_max_manifold'')
          | float(80) %} {% set threshold = [tank_upper * start_ratio, max_temp] |
          min %} {{ manifold >= threshold and manifold > 0 and tank_upper > 0 }}'
      sequence:
      - service: switch.turn_on
        target:
          entity_id: switch.tasmota_4
    - conditions:
      - condition: state
        entity_id: switch.tasmota_4
        state: 'on'
      - condition: template
        value_template: '{% set manifold = states(''sensor.shw_manifold_average'')
          | float(0) %} {% set tank_upper = states(''sensor.shw_tank_upper_average'')
          | float(0) %} {% set stop_ratio = states(''input_number.shw_stop_ratio'')
          | float(1.25) %} {{ manifold <= tank_upper * stop_ratio and tank_upper >
          0 }}'
      sequence:
      - service: switch.turn_off
        target:
          entity_id: switch.tasmota_4
- id: xfer_pump_auto_off
  alias: 'Water: Transfer pump auto-off after 30 minutes'
  description: Safety timer to prevent transfer pump running indefinitely
  trigger:
  - platform: state
    entity_id: switch.tasmota_tasmota2_3
    to: 'on'
    for:
      minutes: 30
  action:
  - service: switch.turn_off
    target:
      entity_id: switch.tasmota_tasmota2_3
- id: beer_chiller_on
  alias: 'Schedule: Beer chiller on (solar)'
  trigger:
  - platform: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: 10
  condition:
  - condition: time
    after: '15:00:00'
    before: '22:00:00'
  action:
  - service: switch.turn_on
    target:
      entity_id: switch.tasmota_3
- id: beer_chiller_off
  alias: 'Schedule: Beer chiller off'
  trigger:
  - platform: time
    at: '22:00:00'
  - platform: numeric_state
    entity_id: sun.sun
    attribute: elevation
    below: 10
  action:
  - service: switch.turn_off
    target:
      entity_id: switch.tasmota_3
- id: desk_light_on
  alias: 'Schedule: Desk light on at dusk'
