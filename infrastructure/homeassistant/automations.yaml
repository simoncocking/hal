- id: '1773611858095'
  alias: SHW pump not active
  description: ''
  use_blueprint:
    path: Ltek/repeating-alerts-ltek.yaml
    input:
      alert_trigger:
      - trigger: numeric_state
        entity_id:
        - sensor.shw_manifold_average
        above: 90
      condition_send_notification:
      - condition: state
